<!DOCTYPE html>
<html>
    <head>
        <title>Spipu3D - lights</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="Spipu3D" />
        <meta name="Description"        content="Pure-JavaScript 3D engine — software and WebGL renderers, FPS physics" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let engine   = null;
let screen   = null;
let hudDebug = null;
let inputs   = null;
let light1   = null;
let light2   = null;
let light3   = null;

let lightHeight = 25.;
let lightRadius = 5.;
const LIGHT_SPEED = 0.015;

function init()
{
    light1 = new Light([255., 0., 0.], 30, [0, 0, 0]);
    light2 = new Light([0., 255., 0.], 30, [0, 0, 0]);
    light3 = new Light([0., 0., 255.], 30, [0, 0, 0]);

    screen = new ScreenManager('screen', {
        fullscreen: true,
        virtualWidth: 1920,
        virtualHeight: 1080
    });
    // The demo only steers: every pad target it has no use for is withdrawn
    // (the aim stick has no such switch and stays).
    inputs = new Inputs().bindScreen(screen).setMouseLockAllowed(false);
    for (const control of ['jump', 'crouch', 'action', 'pause', 'weaponNext', 'fire']) {
        inputs.setVirtualPadControlAllowed(control, false);
    }

    engine = new Engine3d(screen, new Object3dRendererList().getRenderer('webgl'));
    engine.setFov(45.0);
    engine.setZBuffer(1, 100);
    engine.setBackground(10, 10, 10);

    hudDebug = new HudDebug(engine)
        .bindInputs(inputs)
        .addDescription('Use the keyboard to move the lights')
        .addDescription('(c)2026 Spipu')
    ;
    screen.bindHud(hudDebug);

    engine.setLightAmbient([20., 20., 20.]);
    engine.addLight(light1);
    engine.addLight(light2);
    engine.addLight(light3);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    const dt = engine.getDeltaTime();

    lightHeight += dt * LIGHT_SPEED * inputs.readJoy1Y();
    lightRadius += dt * LIGHT_SPEED * inputs.readJoy1X();

    if (lightHeight < 0)  { lightHeight = 0; }
    if (lightHeight > 30) { lightHeight = 30; }
    if (lightRadius < 0)  { lightRadius = 0; }
    if (lightRadius > 30) { lightRadius = 30; }

    const p1 = [lightRadius, lightHeight, 0.];
    const p2 = [-0.5 * lightRadius, lightHeight,  0.866 * lightRadius];
    const p3 = [-0.5 * lightRadius, lightHeight, -0.866 * lightRadius];
    light1.setPosition(p1);
    light2.setPosition(p2);
    light3.setPosition(p3);

    engine.drawInit();

    engine.matrixIdentity();
    engine.matrixRotateZ(180);
    engine.matrixRotateX(180);
    engine.matrixTranslate(0, -5, -60);
    engine.matrixRotateX(45);
    engine.lightsCalculatePosition();

    engine.matrixPush();
    engine.matrixTranslate(p1[0], p1[1], p1[2]);
    engine.drawObject(loader.objects().getByCode('light'));
    engine.matrixPop();

    engine.matrixPush();
    engine.matrixTranslate(p2[0], p2[1], p2[2]);
    engine.drawObject(loader.objects().getByCode('light'));
    engine.matrixPop();

    engine.matrixPush();
    engine.matrixTranslate(p3[0], p3[1], p3[2]);
    engine.drawObject(loader.objects().getByCode('light'));
    engine.matrixPop();

    engine.drawObject(loader.objects().getByCode('ground'));
    engine.drawFinish();
    screen.update();
    requestAnimationFrame(animate);
}

function loadApp()
{
    loader.objects().loadByCode('ground', './assets/objects/ground.obj.json');
    loader.objects().loadByCode('light',  './assets/objects/light.obj.json');
    loader.setCallback(init);
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/lights.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
