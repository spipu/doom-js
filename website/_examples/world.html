<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - world</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let engine   = null;
let world    = null;
let screen   = null;
let hudDebug = null;
let inputs   = null;

function init()
{
    world = loader.world().get();

    screen = new ScreenManager('screen', { fullscreen: true });
    inputs = new Inputs().bindScreen(screen);

    engine = new Engine3d(screen, new Object3dRendererList().getRenderer('webgl'));
    engine.setFov(45.0);
    engine.setZBuffer(0.1, 100);

    hudDebug = new HudDebug(engine)
        .bindInputs(inputs)
        .bindUser(world.getUser())
        .addDescription('Use the keyboard and the mouse to move')
        .addDescription('(c)2026 Spipu')
    ;
    screen.bindHud(hudDebug);

    engine.initFromWorld(world);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    world.update(engine.getDeltaTime(), inputs);
    engine.displayWorld(world);
    screen.update();

    requestAnimationFrame(animate);
}

function loadApp()
{
    loader.world().load('./assets/world/definition.json');
    loader.setCallback(init);
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/world.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
