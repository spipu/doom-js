<!DOCTYPE html>
<html>
    <head>
        <title>Spipu3D - game</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="Spipu3D" />
        <meta name="Description"        content="Pure-JavaScript 3D engine — software and WebGL renderers, FPS physics" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let engine   = null;
let screen   = null;
let hudDebug = null;
let inputs   = null;
let light1   = null;
let light2   = null;
let light3   = null;

let obj_x =-5.;
let obj_y = 0.;
let obj_z =-10.;
let obj_a = -0.;
const obj_dv = 0.015;
const obj_da = 0.1;

function init()
{
    light1 = new Light([255., 255., 255.], 30, [0., 25., 0.]);
    light2 = new Light([0., 200., 0.], 5, [9, 2., 0.]);
    light3 = new Light([200., 0., 0.], 5, [-8, 2., 0.]);

    screen = new ScreenManager('screen', {
        fullscreen: true,
        virtualWidth: 1920,
        virtualHeight: 1080
    });
    // The demo only steers: every pad target it has no use for is withdrawn
    // (the aim stick has no such switch and stays).
    inputs = new Inputs().bindScreen(screen).setMouseLockAllowed(false);
    for (const control of ['jump', 'crouch', 'action', 'pause', 'weaponNext', 'fire']) {
        inputs.setVirtualPadControlAllowed(control, false);
    }

    engine = new Engine3d(screen, new Object3dRendererList().getRenderer('webgl'));
    engine.setFov(45.0);
    engine.setZBuffer(1, 100);
    engine.setBackground(20, 20, 20);

    hudDebug = new HudDebug(engine)
        .bindInputs(inputs)
        .addDescription('Use the keyboard to move the van')
        .addDescription('(c)2026 Spipu')
    ;
    screen.bindHud(hudDebug);

    engine.lightAmbient([40., 40., 40.]);
    engine.lightAdd(light1);
    engine.lightAdd(light2);
    engine.lightAdd(light3);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    const t_d = engine.getDeltaTime();

    const joyX = inputs.readJoy1X();
    const joyY = inputs.readJoy1Y();
    if (joyY !== 0)
    {
        obj_a += t_d * obj_da * joyX * ((joyY > 0) ? 1 : -1);
        obj_x += t_d * obj_dv * joyY * Math.cos(DEG_TO_RAD * obj_a);
        obj_z -= t_d * obj_dv * joyY * Math.sin(DEG_TO_RAD * obj_a);
    }

    if (obj_x < -25.) { obj_x = -25.; }
    if (obj_x >  25.) { obj_x =  25.; }
    if (obj_z < -15.) { obj_z = -15.; }
    if (obj_z >  15.) { obj_z =  15.; }

    engine.drawInit();

    engine.matrixIdentity();
    engine.matrixRotateZ(180);
    engine.matrixRotateX(200);
    engine.matrixTranslate(0, -20, -40);
    engine.lightCalculatePosition(light1);

    engine.matrixPush();
    engine.matrixTranslate(obj_x, obj_y, obj_z);
    engine.matrixRotateY(obj_a);
    engine.lightCalculatePosition(light2);
    engine.lightCalculatePosition(light3);
    engine.drawObject(loader.objects().getByCode('van'));
    engine.matrixPop();

    engine.drawObject(loader.objects().getByCode('ground'));
    engine.drawFinish();
    screen.update();
    requestAnimationFrame(animate);
}

function loadApp()
{
    loader.objects().loadByCode('ground', './assets/objects/ground.obj.json');
    loader.objects().loadByCode('van', './assets/objects/van.obj.json');
    loader.setCallback(init);
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/game.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
