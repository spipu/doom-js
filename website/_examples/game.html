<!DOCTYPE html>
<html>
    <head>
        <title>Spipu3D - game</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="Spipu3D" />
        <meta name="Description"        content="Pure-JavaScript 3D engine — software and WebGL renderers, FPS physics" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let scene    = null;
let hudDebug = null;
let inputs   = null;

function init()
{
    scene = new DemoVanScene('screen');
    // The demo only steers: every pad target it has no use for is withdrawn
    // (the aim stick has no such switch and stays).
    inputs = new Inputs().bindScreen(scene.getScreen()).setMouseLockAllowed(false);
    for (const control of ['jump', 'crouch', 'action', 'pause', 'weaponNext', 'fire']) {
        inputs.setVirtualPadControlAllowed(control, false);
    }

    hudDebug = new HudDebug(scene.getEngine())
        .bindInputs(inputs)
        .addDescription('Use the keyboard to move the van')
        .addDescription('(c)2026 Spipu')
    ;
    scene.getScreen().bindHud(hudDebug);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    const dt = scene.beginFrame(timestamp);
    scene.drive(dt, inputs.readJoy1X(), inputs.readJoy1Y());
    scene.render();
    requestAnimationFrame(animate);
}

function loadApp()
{
    DemoVanScene.load();
    loader.setCallback(init);
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/game.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
