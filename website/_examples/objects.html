<!DOCTYPE html>
<html>
    <head>
        <title>Spipu3D - objects</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="Spipu3D" />
        <meta name="Description"        content="Pure-JavaScript 3D engine — software and WebGL renderers, FPS physics" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
        </style>
    </head>
    <body>
        Object:
        <select id="obj">
            <option value="cube" selected="selected">cube</option>
            <option value="helico_military">helico_military</option>
            <option value="helico_civil"   >helico_civil   </option>
            <option value="lotus"          >lotus          </option>
            <option value="sphere"         >sphere         </option>
            <option value="tank"           >tank           </option>
            <option value="torus"          >torus          </option>
            <option value="car"            >car            </option>
            <option value="dyno"           >dyno           </option>
            <option value="head"           >head           </option>
            <option value="plane"          >plane          </option>
            <option value="ship"           >ship           </option>
            <option value="teddy"          >teddy          </option>
        </select>
         - Resolution:
         <select id="res">
            <option value="160">160x120</option>
            <option value="320">320x240</option>
            <option value="640" selected>640x480</option>
            <option value="800">800x600</option>
            <option value="1024">1024x768</option>
        </select>
        - Renderer:
        <select id="renderer">
            <option value="webgl" selected>WebGL</option>
            <option value="full">Full</option>
            <option value="flat">Flat</option>
            <option value="fast">Fast</option>
        </select><br />
        <i>move the mouse over the 3D object to rotate it</i><br />
        <br />
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let engine = null;
let screen = null;
let angle_x = 0.;
let angle_y = 0.;
let mouse_x = -1;
let mouse_y = -1;

document.addEventListener('mousemove', (e) => {
    if (!screen) {
        return;
    }
    const rect = screen.getCanvas().getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    if (x >= 0 && y >= 0 && x <= rect.width && y <= rect.height) {
        mouse_x = x;
        mouse_y = y;
    }
});

function changeObject()
{
    if (engine) {
        engine.destroy();
        engine = null;
    }

    if (screen) {
        screen.destroyContainer();
        screen = null;
    }

    const obj = document.getElementById('obj').value;

    loader.reset();
    loader.objects().load('./assets/objects/' + obj + '.obj.json');
    loader.setCallback(init);
}

function init()
{
    const res      = parseInt(document.getElementById('res').value);
    const renderer = document.getElementById('renderer').value;

    if (screen) {
        screen.destroyContainer();
        screen = null;
    }

    screen = new ScreenManager('screen', { width: res, height: ((res * 24) / 32) });

    engine = new Engine3d(screen, new Object3dRendererList().getRenderer(renderer));
    engine.setBackground(35, 35, 35);
    engine.setFov(45.0);
    engine.setZBuffer(1, 100);

    const code = document.getElementById('obj').value;
    const obj  = loader.objects().get(0);
    const hub = new HudDebug(engine)
        .addDescription(code + ' | ' + obj.getVertexCount() + ' pts | ' + obj.getFaceCount() + ' faces')
        .addDescription('(c)2026 Spipu')
    ;
    screen.bindHud(hub);

    engine.lightAmbient([40., 40., 40.]);
    engine.lightAdd(new Light([250., 250., 250.], 40, [  0., 5, 10.]));
    engine.lightAdd(new Light([250.,   0.,   0.], 30, [ 20., 0,  0.]));
    engine.lightAdd(new Light([  0.,   0., 250.], 30, [-20., 0,  0.]));

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    if (!engine) {
        return;
    }

    engine.calculateDeltaTime(timestamp);

    const t_d = engine.getDeltaTime();
    let x = mouse_x;
    let y = mouse_y;
    if (x < 0) {
        x = 0;
        y = 0;
    } else {
        x = 2. * (x - Math.trunc(engine.scrWidth  / 2)) / engine.scrWidth;
        y = 2. * (y - Math.trunc(engine.scrHeight / 2)) / engine.scrHeight;
    }

    if (Math.abs(x) < 0.1) { x = 0; }
    if (Math.abs(y) < 0.1) { y = 0; }

    angle_x -= x * 0.1 * t_d;
    angle_y -= y * 0.1 * t_d;

    engine.drawInit();
    engine.matrixIdentity();
    engine.lightsCalculatePosition();

    engine.matrixTranslate(0, 0, 35);
    engine.matrixRotateY(angle_x);
    engine.matrixRotateX(angle_y);
    engine.drawObject(loader.objects().get(0));
    engine.drawFinish();

    screen.update();

    requestAnimationFrame(animate);
}

function loadApp()
{
    document.getElementById('obj').addEventListener('change', changeObject);
    document.getElementById('res').addEventListener('change', init);
    document.getElementById('renderer').addEventListener('change', init);

    changeObject();
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/objects.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
