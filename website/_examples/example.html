<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - example</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <link rel="stylesheet" href="/css/main.css" />
    </head>
    <body>
        <div id="screen"></div>
        <script src="/js/webapp/appBootstrap.js"></script>
        <script>

let engine   = null;
let screen   = null;
let hudDebug = null;

function init()
{
    screen = new ScreenManager('screen', { fullscreen: true });

    engine = new Engine3d(screen, new Object3dRendererList().getRenderer('webgl'));
    engine.setBackground(35, 35, 35);
    engine.setFov(45.0);
    engine.setZBuffer(1, 80);

    hudDebug = new HudDebug(engine)
        .addDescription('(c)2026 Spipu')
    ;
    screen.bindHud(hudDebug);

    engine.lightAmbient([40., 40., 40.]);
    engine.lightAdd(new Light([255., 50., 50.], 50, [10.,0, 10.]));
    engine.lightAdd(new Light([50., 255., 50.], 50, [-10.,0, 10.]));

    animate();
    setInterval(animate, 1000);
}

function animate()
{
    engine.drawInit();

    engine.matrixIdentity();
    engine.lightsCalculatePosition();

    engine.matrixRotateX(180);
    engine.matrixRotateZ(180);
    engine.matrixTranslate(4, 5, -50);
    engine.matrixRotateY(-30);
    engine.matrixRotateX(-60);
    engine.drawObject(loader.objects().getByCode('lotus'));
    engine.drawFinish();

    screen.update();
}

function loadApp()
{
    loader.objects().loadByCode('lotus', './assets/objects/lotus.obj.json');
    loader.setCallback(init);
}

appBootstrap.disablePwaMode();
appBootstrap.addBootstrapDefinition('/js/engine/libBootstrap.json');
appBootstrap.addBootstrapDefinition('./assets/example.json');
appBootstrap.setReadyCallback(loadApp);
        </script>
    </body>
</html>
