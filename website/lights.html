<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - lights</title>
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
</style>
    </head>
    <body>
        <input type="button" onclick="init3d()" value="Start / Stop" /><br />
        <i>click on the "Start / Stop" button, and use the keyboard to move the lights</i><br />
        <br />
        <canvas id="canvasElem"></canvas><br />
        <span id="div_fps"></span><br />
        <br />
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
        <script src="js/object3d.js" ></script>
        <script src="js/object3dFactory.js" ></script>
        <script src="js/matrix.js" ></script>
        <script src="js/light.js" ></script>
        <script src="js/engine3d.js" ></script>
        <script src="js/input.js" ></script>
        <script>
object3dFactory.load('ground', 'objects/ground.obj.json');
object3dFactory.load('light',  'objects/light.obj.json');

var image = null;
var fps_count = 0;
var t_1 = 0;
var t_2 = 0;
var t_d = 0;
var obj_z = 25.;
var obj_r = 5.;
var obj_dv = 0.015;

var light1 = null;
var light2 = null;
var light3 = null;

var input = new Input();
input.initKeyboard();

function init3d()
{
    if (image)
    {
        image = null;
        return;
    }

    if (!object3dFactory.isReady()) {
        setTimeout(init3d, 100);
        return;
    }

    image = new Engine3d('canvasElem');
    image.setScreen(320, 240);
    image.setBackground(10, 10, 10);
    image.setFov(45.0);
    image.setView(-32, 32, -24, 24);
    image.setZBuffer(1, 100);

    image.lightAmbient([20., 20., 20.]);
    light1 = image.lightAdd([255., 0., 0.], 30);
    light2 = image.lightAdd([0., 255., 0.], 30);
    light3 = image.lightAdd([0., 0., 255.], 30);

    t_1 = new Date().getTime();
    animate();
}

function animate()
{
    if (!image) return;
    t_2 = t_1;
    t_1 = new Date().getTime();
    t_d = (t_1-t_2);

    if (input.readKeyUp())    obj_z+= t_d*obj_dv;
    if (input.readKeyDown())  obj_z-= t_d*obj_dv;
    if (input.readKeyLeft())  obj_r-= t_d*obj_dv;
    if (input.readKeyRight()) obj_r+= t_d*obj_dv;

    if (obj_z<0)  obj_z=0;
    if (obj_z>30) obj_z=30;
    if (obj_r<0)  obj_r=0;
    if (obj_r>30) obj_r=30;

    image.drawInit();

    image.matrixIdentity();
    image.matrixRotateX(180);
    image.matrixTranslate(0,-5,-35);
    image.matrixRotateX(45);
    var p1 = [obj_r, obj_z, 0.];
    var p2 = [-0.5*obj_r, obj_z, 0.866*obj_r];
    var p3 = [-0.5*obj_r, obj_z,-0.866*obj_r];
    image.lightMove(light1, p1);
    image.lightMove(light2, p2);
    image.lightMove(light3, p3);

    image.matrixPush();
    image.matrixTranslate(p1[0], p1[1], p1[2]);
    image.drawObject(object3dFactory.get('light'));
    image.matrixPop();

    image.matrixPush();
    image.matrixTranslate(p2[0], p2[1], p2[2]);
    image.drawObject(object3dFactory.get('light'));
    image.matrixPop();

    image.matrixPush();
    image.matrixTranslate(p3[0], p3[1], p3[2]);
    image.drawObject(object3dFactory.get('light'));
    image.matrixPop();

    image.drawObject(object3dFactory.get('ground'));
    image.drawFinish();
    fps_count++;
    setTimeout(animate, 1);
}

function displayFps()
{
    document.getElementById('div_fps').innerHTML = Math.floor(fps_count / 3)+' FPS';
    fps_count=0;
}

setInterval(displayFps, 3000);
        </script>
    </body>
</html>
