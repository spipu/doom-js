<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - lights</title>

        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
</style>
    </head>
    <body>
        <i>use the keyboard to move the lights</i><br />
        <br />
        <canvas id="canvasElem"></canvas><br />
        <br />
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
        <script src="js/loader.js" ></script>
        <script>
object3dFactory.load('ground', 'objects/ground.obj.json');
object3dFactory.load('light',  'objects/light.obj.json');

var engine = null;
var obj_z = 25.;
var obj_r = 5.;
var obj_dv = 0.015;

var light1 = null;
var light2 = null;
var light3 = null;

var input = new Input();
input.initKeyboard();

init3d();

function init3d()
{
    if (!object3dFactory.isReady()) {
        setTimeout(init3d, 100);
        return;
    }

    engine = new Engine3d('canvasElem');
    engine.setScreen(640, 480);
    engine.setBackground(10, 10, 10);
    engine.setFov(45.0);
    engine.setView(-32, 32, -24, 24);
    engine.setZBuffer(1, 100);
    engine.enableFps();

    engine.lightAmbient([20., 20., 20.]);
    light1 = engine.lightAdd([255., 0., 0.], 30);
    light2 = engine.lightAdd([0., 255., 0.], 30);
    light3 = engine.lightAdd([0., 0., 255.], 30);

    animate();
}

function animate()
{
    engine.calculateDeltaTime();
    const t_d = engine.getDeltaTime();

    if (input.readKeyUp())    obj_z+= t_d*obj_dv;
    if (input.readKeyDown())  obj_z-= t_d*obj_dv;
    if (input.readKeyLeft())  obj_r-= t_d*obj_dv;
    if (input.readKeyRight()) obj_r+= t_d*obj_dv;

    if (obj_z<0)  obj_z=0;
    if (obj_z>30) obj_z=30;
    if (obj_r<0)  obj_r=0;
    if (obj_r>30) obj_r=30;

    engine.drawInit();

    engine.matrixIdentity();
    engine.matrixRotateX(180);
    engine.matrixTranslate(0,-5,-35);
    engine.matrixRotateX(45);
    var p1 = [obj_r, obj_z, 0.];
    var p2 = [-0.5*obj_r, obj_z, 0.866*obj_r];
    var p3 = [-0.5*obj_r, obj_z,-0.866*obj_r];
    engine.lightMove(light1, p1);
    engine.lightMove(light2, p2);
    engine.lightMove(light3, p3);

    engine.matrixPush();
    engine.matrixTranslate(p1[0], p1[1], p1[2]);
    engine.drawObject(object3dFactory.get('light'));
    engine.matrixPop();

    engine.matrixPush();
    engine.matrixTranslate(p2[0], p2[1], p2[2]);
    engine.drawObject(object3dFactory.get('light'));
    engine.matrixPop();

    engine.matrixPush();
    engine.matrixTranslate(p3[0], p3[1], p3[2]);
    engine.drawObject(object3dFactory.get('light'));
    engine.matrixPop();

    engine.drawObject(object3dFactory.get('ground'));
    engine.drawFinish();
    setTimeout(animate, 1);
}
        </script>
    </body>
</html>
