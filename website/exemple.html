function afficher()
{
    if (!lotus.isReady()) { setTimeout('afficher();', 500); return false; }
    
    var image = new Moteur3D('canvasElem');

    image.setBackground(35, 35, 35);

    image.setView(-32, 32, -24, 24);
    image.setZBuffer(1, 80);

    image.drawFinish();
}
