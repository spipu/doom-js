<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - exemple</title>
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252" />
        <meta name="Title"              content="mini moteur 3D en javascript" /> 
        <meta name="Description"        content="moteur 3D, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />  
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <meta http-equiv="Content-Type" content="text/html; charset=windows-1252" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
</style>
        <script src="js/object3d.js" ></script>
        <script src="js/object3dFactory.js" ></script>
        <script src="js/matrix.js" ></script>
        <script src="js/light.js" ></script>
        <script src="js/engine3d.js" ></script>
        <script src="js/input.js" ></script>
        <script>
let image     = null;
let fps_count = 0;
let t_1       = 0;
let t_2       = 0;
let t_d       = 0;
let res       = '';
let angle_x   = 0;
let angle_y   = 0;

const input = new Input();
input.initMouse('canvasElem');

function changeObject()
{
    let obj = document.getElementById('obj').value;

    object3dFactory.reset();
    object3dFactory.load('object', './objects/' + obj + '.obj.json');
}

function changeResolution()
{
    if (image) {
        stop();
        start();
    }
}

function switchFastDisplay()
{
    if (image) {
        image.fastDisplay(document.getElementById('check_fastdisplay').checked ? 'on' : 'off');
    }
}

function switchStartStop()
{
    if (image) {
        stop();
        return;
    }

    start();
}

function stop()
{
    image = null;
}

function start()
{
    let res = document.getElementById('res').value;

    image = new Engine3d('canvasElem');
    image.setScreen(res, res * 24 / 32);
    image.setBackground(35, 35, 35);
    image.setFov(45.0);
    image.setView(-32, 32, -24, 24);
    image.setZBuffer(1, 100);

    image.lightAmbient([40., 40., 40.]);
    image.lightAdd([250., 250., 250.], 40, [  0., 5, 10.]);
    image.lightAdd([250.,   0.,   0.], 30, [ 20., 0,  0.]);
    image.lightAdd([  0.,   0., 250.], 30, [-20., 0,  0.]);

    switchFastDisplay();
    t_1 = new Date().getTime();
    display();
}

function display()
{
    if (!image) {
        return;
    }

    if (!object3dFactory.isReady()) {
        setTimeout(display, 500);
        return;
    }

    t_2 = t_1;
    t_1 = new Date().getTime();
    t_d = t_1 - t_2;

    let x = input.readMouseX();
    let y = input.readMouseY();
    if (x < 0) {
        x = 0;
        y = 0;
    } else {
        x = 2. * (x - Math.trunc(image.scr_width  / 2)) / image.scr_width;
        y = 2. * (y - Math.trunc(image.scr_height / 2)) / image.scr_height;
    }

    if (Math.abs(x) < 0.1) x = 0;
    if (Math.abs(y) < 0.1) y = 0;

    angle_x -= x * 0.1 * t_d;
    angle_y += y * 0.1 * t_d;

    image.matrixIdentity();
    image.matrixTranslate(0, 0, 35);
    image.matrixRotateY(angle_x);
    image.matrixRotateX(angle_y);

    image.drawInit();
    image.drawObject(object3dFactory.get('object'));
    image.drawFinish();
    fps_count++;
    setTimeout(display, 2);
}

function displayFps()
{
    const current = object3dFactory.get('object');
    if (!current) return;
    document.getElementById('div_fps').innerHTML = Math.floor(fps_count / 3) + ' fps'
        + ' (' + current.getFaceCount() + ' pts | ' + current.getVertexCount() + ' faces)';
    fps_count = 0;
}

setInterval(displayFps, 3000);

document.addEventListener('DOMContentLoaded', changeObject);

</script>
    </head>
    <body>
        Objet :
        <select id="obj" onchange="changeObject();">
            <option value="cube" selected="selected">cube</option>
            <option value="helico_military">helico_military</option>
            <option value="helico_civil"   >helico_civil   </option>
            <option value="lotus"          >lotus          </option>
            <option value="sphere"         >sphere         </option>
            <option value="tank"           >tank           </option>
            <option value="tore"           >tore           </option>
            <option value="voiture"        >voiture        </option>
            <option value="dyno"           >dyno           </option>
            <option value="head"           >head           </option>
            <option value="plane"          >plane          </option>
            <option value="ship"           >ship           </option>
            <option value="teddy"          >teddy          </option>
        </select>
         - Resolution
         <select id="res" onchange="changeResolution();">
            <option value="160">160x120</option>
            <option value="320" selected="selected">320x240</option>
            <option value="640">640x480</option>
            <option value="800">800x600</option>
            <option value="1024">1024x768</option>
        </select>
        - <input type="checkbox" value="1" id="check_fastdisplay" onclick="switchFastDisplay();" onchange="switchFastDisplay();" onkeyup="switchFastDisplay();" /> fastDisplay
        - <input type="button" onclick="switchStartStop()" value="Start / Stop" /><br />
        <i>click on the "Start / Stop" button, and move the mouse under the 3D object</i><br />
        <br />
        <canvas id="canvasElem"></canvas><br />
        <span id="div_fps"></span><br />
        <br />
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
    </body>
</html>
