<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - doom</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <style>
body { background: #000; padding: 0; margin: 0; }
        </style>
    </head>
    <body>
        <canvas id="canvasElem"></canvas>
        <script src="js/bootstrap.js" ></script>
        <script>

let engine   = null;
let world    = null;
let screen   = null;
let hudDebug = null;

const keyboard = new InputKeyboard();
const mouse    = new InputMouse(document.getElementById('canvasElem'));

function init()
{
    world  = loader.world().get();

    engine = new Engine3d('canvasElem', new Object3dRendererList().getRenderer('webgl'));
    engine.setFov(45.0);
    engine.setZBuffer(0.1, 100);

    hudDebug = new HudDebug(engine).bindKeyboard(keyboard).bindMouse(mouse).bindUser(world.getUser());
    screen   = new ScreenManager(engine, hudDebug, { fullscreen: true });

    engine.initFromWorld(world);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    world.update(engine.getDeltaTime(), keyboard, mouse);
    engine.displayWorld(world);
    screen.update();

    requestAnimationFrame(animate);
}

loader.world().load('./assets/doom/definition.json');
loader.setCallback(init);
        </script>
    </body>
</html>
