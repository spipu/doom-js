<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - game</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
        </style>
    </head>
    <body>
        <i>use the keyboard to move the car</i><br />
        <br />
        <canvas id="canvasElem"></canvas><br />
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
        <div id="debug" style="color:#aaa;font-size:11px;margin:4px 0;"></div>
        <script src="js/loader.js" ></script>
        <script>
object3dFactory.load('ground', 'objects/ground.obj.json');
object3dFactory.load('van', 'objects/van.obj.json');

var engine = null;
var obj_x =-5.;
var obj_y = 0.;
var obj_z =-10.;
var obj_a = -0.;
var obj_dv = 0.015;
var obj_da = 0.1;

const light1 = new Light([255., 255., 255.], 30, [0., 25., 0.]);
const light2 = new Light([0., 200., 0.], 5, [9, 2., 0.]);
const light3 = new Light([200., 0., 0.], 5, [-8, 2., 0.]);

const keyboard = new InputKeyboard();
const debug    = new Debug(document.getElementById('debug')).bindKeyboard(keyboard);

function init()
{
    engine = new Engine3d('canvasElem', new Object3dRendererFactory().getRenderer('webgl'));
    engine.setScreen(640, 480);
    engine.setBackground(35, 35, 35);
    engine.setFov(45.0);
    engine.setView(-32, 32, -24, 24);
    engine.setZBuffer(1, 100);
    debug.bindEngine(engine);

    engine.lightAmbient([40., 40., 40.]);
    engine.lightAdd(light1);
    engine.lightAdd(light2);
    engine.lightAdd(light3);

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    const t_d = engine.getDeltaTime();

    if (keyboard.readKeyUp())
    {
        if (keyboard.readKeyLeft())  obj_a-= t_d*obj_da;
        if (keyboard.readKeyRight()) obj_a+= t_d*obj_da;
        obj_x+= t_d*obj_dv*Math.cos(DEG_TO_RAD*obj_a);
        obj_z-= t_d*obj_dv*Math.sin(DEG_TO_RAD*obj_a);
    }
    if (keyboard.readKeyDown())
    {
        if (keyboard.readKeyLeft())  obj_a+= t_d*obj_da;
        if (keyboard.readKeyRight()) obj_a-= t_d*obj_da;
        obj_x-= t_d*obj_dv*Math.cos(DEG_TO_RAD*obj_a);
        obj_z+= t_d*obj_dv*Math.sin(DEG_TO_RAD*obj_a);
    }

    if (obj_x<-25.) obj_x =-25.;
    if (obj_x>25.)  obj_x = 25.;
    if (obj_z<-15.) obj_z =-15.;
    if (obj_z>15.)  obj_z = 15.;

    engine.drawInit();

    engine.matrixIdentity();
    engine.matrixRotateZ(180);
    engine.matrixRotateX(180);
    engine.matrixTranslate(0,-10,-35);
    engine.lightCalculatePosition(light1);

    engine.matrixPush();
    engine.matrixTranslate(obj_x, obj_y, obj_z);
    engine.matrixRotateY(obj_a);
    engine.lightCalculatePosition(light2);
    engine.lightCalculatePosition(light3);
    engine.drawObject(object3dFactory.get('van'));
    engine.matrixPop();

    engine.drawObject(object3dFactory.get('ground'));
    engine.drawFinish();
    debug.update();
    requestAnimationFrame(animate);
}

object3dFactory.setLoadedCallback(init);
        </script>
    </body>
</html>
