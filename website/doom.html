<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - doom</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div#energy-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; pointer-events: none; opacity: 0; }
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
div.mouse        { color:#aaa; margin:4px 0;}
div#debug        { color: #aaa; text-align: left; width: 600px; margin: auto }
        </style>
    </head>
    <body>
        <div style="position:relative; display:inline-block;">
            <canvas id="canvasElem"></canvas>
            <div id="energy-overlay"></div>
        </div>
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
        <div class="mouse">Click on canvas to capture mouse. Press [ESC] to release.</div>
        <div id="debug"></div>
        <script src="js/loader.js" ></script>
        <script>

const world = new World('./assets/doom/definition.json');

let engine = null;
const energyOverlay = document.getElementById('energy-overlay');

const keyboard = new InputKeyboard();
const mouse    = new InputMouse(document.getElementById('canvasElem'));
const debug    = new Debug(document.getElementById('debug'))
    .bindKeyboard(keyboard)
    .bindMouse(mouse);

function init()
{
    debug.bindUser(world.getUser());

    engine = new Engine3d('canvasElem', new Object3dRendererFactory().getRenderer('webgl'));
    engine.setScreen(800, 600);
    engine.setBackground(50, 50, 50);
    engine.setFov(45.0);
    engine.setView(-32, 32, -24, 24);
    engine.setZBuffer(0.1, 100);
    debug.bindEngine(engine);

    engine.lightAmbient(world.getLightAmbient());
    world.getLights().forEach(l => engine.lightAdd(l));

    requestAnimationFrame(animate);
}

function animate(timestamp)
{
    engine.calculateDeltaTime(timestamp);
    world.update(engine.getDeltaTime(), keyboard, mouse);
    engine.displayWorld(world);
    debug.update();

    const user = world.getUser();
    energyOverlay.style.opacity = user.isDead() ? 0.5 : Math.min(0.6, user.getEnergyFlash());

    requestAnimationFrame(animate);
}

world.setLoadedCallback(init);
        </script>
    </body>
</html>
