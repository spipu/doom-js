<!DOCTYPE html>
<html>
    <head>
        <title>Proto3d - world</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="Title"              content="mini 3D engine in javascript" />
        <meta name="Description"        content="3D engine, javascript" />
        <meta name="Author"             content="Spipu" />
        <meta name="Reply-to"           content="webmaster@spipu.net" />
        <meta name="Copyright"          content="(c)2026 Spipu" />
        <style>
body             { background: #000; color: #EEE; padding: 0; margin: 20px; font-size: 12px; font-family: verdana; text-align: center }
canvas           { border: 1px solid grey; background: #FFF;}
div.copy         { text-align: center;color: #ccc;}
div.copy a       { color: #bbb; text-decoration: none;}
div.copy a:hover { color: #ddd; text-decoration: underline; }
        </style>
    </head>
    <body>
        <canvas id="canvasElem"></canvas>
        <div class="copy">&copy;2026 <a href="http://spipu.net/">Spipu</a></div>
        <div id="debug" style="color:#aaa;font-size:11px;margin:4px 0;"></div>
        <script src="js/loader.js" ></script>
        <script>

const user = new User(-5.25, 0, -5.25, 180, 0)
    .setHeight(0.85)
    .setEyeRatio(0.82);

// Static light world positions
const LIGHTS = [
    { color: [200, 200, 200], dist: 24.75, pos: [ 0.00,  13.00,   0.00] },
    { color: [255,   0,   0], dist:  3.15, pos: [ 5.25,   1.30,  -8.75] },
    { color: [  0, 255,   0], dist:  3.15, pos: [-1.75,   1.30,  -5.25] },
    { color: [  0,   0, 200], dist: 19.95, pos: [ 0.00,  -0.90, -40.25] },
];

let engine    = null;
let light_ids = [];

const keyboard = new InputKeyboard();
const mouse    = new InputMouse(document.getElementById('canvasElem'));
const debug = new Debug(document.getElementById('debug'))
    .bindUser(user)
    .bindKeyboard(keyboard)
    .bindMouse(mouse);

object3dFactory.load('map',      './world/objects/map.obj.json');
instanceFactory.load('entrance', './world/instances/entrance.instance.json');
instanceFactory.load('door',     './world/instances/door.instance.json');
instanceFactory.load('cube1',    './world/instances/cube1.instance.json');
instanceFactory.load('cube2',    './world/instances/cube2.instance.json');
instanceFactory.load('lift',     './world/instances/lift.instance.json');

function start()
{
    if (!object3dFactory.isReady() || !instanceFactory.isReady()) {
        setTimeout(start, 500);
        return;
    }

    engine = new Engine3d('canvasElem', new Object3dRendererFactory().getRenderer('webgl'));
    engine.setScreen(640, 480);
    engine.setBackground(120, 100, 140);
    engine.setFov(45.0);
    engine.setView(-32, 32, -24, 24);
    engine.setZBuffer(0.1, 100);
    debug.bindEngine(engine);

    engine.lightAmbient([20., 20., 20.]);
    for (let i = 0; i < LIGHTS.length; i++) {
        light_ids[i] = engine.lightAdd(LIGHTS[i].color, LIGHTS[i].dist);
    }

    display();
}

function display()
{
    engine.calculateDeltaTime();

    user.beginFrame(engine.getDeltaTime());

    if (keyboard.readKeyForward())     user.moveForward();
    if (keyboard.readKeyBackward())    user.moveBackward();
    if (keyboard.readKeyStrafeLeft())  user.strafeLeft();
    if (keyboard.readKeyStrafeRight()) user.strafeRight();

    const lookDelta = engine.getDeltaTime() * 1.5;
    user.lookMouse(
        mouse.readDeltaX() + (keyboard.readKey('KeyU') ? -lookDelta : 0) + (keyboard.readKey('KeyI') ? lookDelta : 0),
        mouse.readDeltaY()
    );

    user.updateMove();
    engine.setCamera(user);

    for (let i = 0; i < LIGHTS.length; i++) {
        engine.lightMove(light_ids[i], LIGHTS[i].pos);
    }

    const dt        = engine.getDeltaTime();
    const action    = keyboard.readKeyAction();
    const instances = instanceFactory.getAll();
    instances.forEach(inst => inst.update(dt, user, action));

    engine.drawInit();
    engine.drawObject(object3dFactory.get('map'));
    instances.forEach(inst => engine.drawInstance(inst));

    engine.drawFinish();

    debug.update();

    setTimeout(display, 1);
}

start();
        </script>
    </body>
</html>
